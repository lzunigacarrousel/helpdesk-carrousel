name: Helpdesk Carrousel CI

on:
  push:
    branches: [main, 'fase*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application-quality:
    name: Application quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo, zip
          coverage: none

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app config public tests tools -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/assets/js -type f -name '*.js' -print0)

      - name: Static project checks
        run: php tests/static_checks.php

      - name: Installer safety regression
        run: php tests/installer_safety_smoke.php

      - name: Dark theme regression
        run: php tests/dark_theme_smoke.php

      - name: Dark theme standalone coverage
        run: php tests/dark_theme_coverage_smoke.php

      - name: Dark theme public surfaces
        run: php tests/dark_theme_public_smoke.php

      - name: Dark theme interaction and motion parity
        run: php tests/dark_theme_motion_smoke.php

      - name: Attachment and notification navigation regression
        run: php tests/navigation_ux_smoke.php

      - name: Requester return visibility regression
        run: php tests/requester_return_visibility_smoke.php

      - name: Searchable select regression
        run: php tests/searchable_select_smoke.php

      - name: Requester UX regression
        run: php tests/requester_ux_smoke.php

      - name: Phase 3 operational regression
        run: php tests/phase3_operational_smoke.php

      - name: Pre Phase 4 cleanup regression
        run: php tests/pre_phase4_cleanup_smoke.php

      - name: Pre Phase 4 integral gate definition
        run: php tests/pre_phase4_gate_smoke.php

      - name: Phase 5 activities schema regression
        run: php tests/phase5_activities_schema_regression.php

      - name: Phase 5 activities service regression
        run: php tests/phase5_activities_service_regression.php

      - name: Phase 5 activities UI regression
        run: php tests/phase5_activities_ui_regression.php

      - name: Phase 6 agenda service regression
        run: php tests/phase6_agenda_service_regression.php

      - name: Phase 6 agenda UI regression
        run: php tests/phase6_agenda_ui_regression.php

      - name: Phase 6 agenda filter UX regression
        run: php tests/phase6_agenda_filter_ux_regression.php

      - name: Phase 7 provider participation regression
        run: php tests/phase7_provider_participation_regression.php

      - name: Phase 7 provider catalog regression
        run: php tests/phase7_provider_catalog_regression.php

      - name: Phase 8 provider rating - cycle identity
        run: php tests/phase8_provider_cycle_identity_regression.php

      - name: Phase 8 provider rating - service
        run: php tests/phase8_provider_rating_service_regression.php

      - name: Phase 8 provider rating - controller
        run: php tests/phase8_provider_rating_controller_regression.php

      - name: Phase 8 provider rating - UI
        run: php tests/phase8_provider_rating_ui_regression.php

      - name: Phase 8 provider rating - reports
        run: php tests/phase8_provider_rating_report_regression.php

      - name: Phase 8 external provider - case history
        run: php tests/phase8_external_case_history_regression.php

      - name: Phase 8 external provider - Excel history
        run: php tests/phase8_external_case_export_regression.php

      - name: Phase 8 provider rating - closeout
        run: php tests/phase8_provider_rating_closeout_regression.php

      - name: Phase 9 knowledge - schema
        run: php tests/phase9_knowledge_schema_regression.php

      - name: Phase 9 knowledge - revision service
        run: php tests/phase9_knowledge_revision_service_regression.php

      - name: Phase 9 knowledge - permissions
        run: php tests/phase9_knowledge_permissions_regression.php

      - name: Phase 9 knowledge - workflow controller
        run: php tests/phase9_knowledge_workflow_controller_regression.php

      - name: Phase 9 knowledge - candidates
        run: php tests/phase9_knowledge_candidate_regression.php

      - name: Phase 9 knowledge - references
        run: php tests/phase9_knowledge_reference_regression.php

      - name: Phase 9 knowledge - suggestions
        run: php tests/phase9_solution_suggestions_regression.php

      - name: Phase 9 knowledge - self service
        run: php tests/phase9_self_service_regression.php

      - name: Phase 9 knowledge - history
        run: php tests/phase9_knowledge_history_regression.php

      - name: Phase 9 knowledge - metrics
        run: php tests/phase9_knowledge_metrics_regression.php

      - name: Phase 9 knowledge - UI and help
        run: php tests/phase9_knowledge_ui_regression.php

      - name: UI - canonical button semantics
        run: php tests/button_semantics_regression.php

      - name: Phase 9 knowledge - transversal legacy reads
        run: php tests/phase9_knowledge_legacy_read_regression.php

      - name: Phase 10 reports - hub
        run: php tests/phase10_reports_hub_regression.php

      - name: Phase 10 reports - knowledge summary
        run: php tests/phase10_knowledge_report_regression.php

      - name: Phase 10 reports - activity summary
        run: php tests/phase10_activity_report_regression.php

      - name: Phase 10 reports - ticket SLA XLSX parity
        run: php tests/phase10_ticket_sla_xlsx_regression.php

      - name: Phase 10 reports - provider summary
        run: php tests/phase10_provider_report_regression.php

      - name: Phase 10 reports - support team summary
        run: php tests/phase10_support_team_report_regression.php

      - name: Phase 10 reports - specialized exports
        run: php tests/phase10_specialized_exports_regression.php

      - name: Phase 9 knowledge - closeout
        run: php tests/phase9_closeout_regression.php

      - name: Route, view and CSS quality gate
        run: php tests/project_quality.php

      - name: XLSX regression smoke test
        run: php tests/xlsx_smoke.php

  fresh-database-install:
    name: Fresh MariaDB installation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install canonical schema
        env:
          MYSQL_PWD: root
        run: mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/INSTALAR.sql

      - name: Verify clean database
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/VERIFICAR_INSTALACION.sql
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='carrousel_helpdesk' AND TABLE_TYPE='BASE TABLE';")" = "43"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.parks WHERE is_active=1 AND region_id IS NOT NULL;")" = "29"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.users;")" = "1"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='helpdesk_carrousel';")" = "0"

      - name: Verify Phase 5 schema
        env:
          MYSQL_PWD: root
        run: mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/VERIFICAR_FASE5_ACTIVIDADES_20260913.sql
