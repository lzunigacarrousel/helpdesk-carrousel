name: Helpdesk Carrousel CI

on:
  push:
    branches: [v2-rebuild, ui-normalization-working]
  pull_request:
    branches: [v2-rebuild]

permissions:
  contents: read

jobs:
  application-quality:
    name: Application quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo, zip
          coverage: none

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app config public tests tools -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/assets/js -type f -name '*.js' -print0)

      - name: Static project checks
        run: php tests/static_checks.php

      - name: Installer safety regression
        run: php tests/installer_safety_smoke.php

      - name: Dark theme regression
        run: php tests/dark_theme_smoke.php

      - name: Dark theme standalone coverage
        run: php tests/dark_theme_coverage_smoke.php

      - name: Dark theme public surfaces
        run: php tests/dark_theme_public_smoke.php

      - name: Searchable select regression
        run: php tests/searchable_select_smoke.php

      - name: Requester UX regression
        run: php tests/requester_ux_smoke.php

      - name: Phase 3 operational regression
        run: php tests/phase3_operational_smoke.php

      - name: Pre Phase 4 cleanup regression
        run: php tests/pre_phase4_cleanup_smoke.php

      - name: Route, view and CSS quality gate
        run: php tests/project_quality.php

      - name: XLSX regression smoke test
        run: php tests/xlsx_smoke.php

  fresh-database-install:
    name: Fresh MariaDB installation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install canonical schema
        env:
          MYSQL_PWD: root
        run: mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/INSTALAR.sql

      - name: Verify clean database
        env:
          MYSQL_PWD: root
        run: |
          mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/VERIFICAR_INSTALACION.sql
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='carrousel_helpdesk' AND TABLE_TYPE='BASE TABLE';")" = "36"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.parks WHERE is_active=1 AND region_id IS NOT NULL;")" = "29"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.users;")" = "1"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='helpdesk_carrousel';")" = "0"
