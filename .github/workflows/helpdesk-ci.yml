name: Helpdesk Carrousel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  application-quality:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo, zip
          coverage: none

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find app config public tests tools -type f -name '*.php' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/assets/js -type f -name '*.js' -print0)

      - name: Repository release contract
        run: php tests/release_repository_regression.php

      - name: Static project checks
        run: php tests/static_checks.php

      - name: Installer safety
        run: php tests/installer_safety_smoke.php

      - name: Clean schema contract
        run: php tests/preprod_clean_schema_regression.php

      - name: Route, view and CSS quality
        run: php tests/project_quality.php

      - name: XLSX regression
        run: php tests/xlsx_smoke.php

      - name: Knowledge versioning service
        run: php tests/phase9_knowledge_revision_service_regression.php

      - name: Knowledge schema
        run: php tests/phase9_knowledge_schema_regression.php

      - name: Knowledge without legacy fallback
        run: php tests/phase9_knowledge_legacy_read_regression.php

      - name: Deployment targets
        run: php tests/phase12_deployment_targets_regression.php

  fresh-database-install:
    name: Fresh MariaDB installation
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Install canonical schema
        env:
          MYSQL_PWD: root
        run: mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/INSTALAR.sql

      - name: Verify canonical schema
        env:
          MYSQL_PWD: root
        run: mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/VERIFICAR_INSTALACION.sql

      - name: Verify clean production mirror
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          mariadb -h127.0.0.1 -uroot --default-character-set=utf8mb4 < database/VERIFICAR_PRODUCCION_LIMPIA.sql | tee /tmp/helpdesk-clean.txt
          grep -qx "PASS" /tmp/helpdesk-clean.txt

      - name: Verify canonical counts
        env:
          MYSQL_PWD: root
        shell: bash
        run: |
          set -euo pipefail
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='carrousel_helpdesk' AND TABLE_TYPE='BASE TABLE';")" = "42"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.parks WHERE is_active=1 AND region_id IS NOT NULL;")" = "29"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM carrousel_helpdesk.users;")" = "1"
          test "$(mariadb -h127.0.0.1 -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='helpdesk_carrousel';")" = "0"
